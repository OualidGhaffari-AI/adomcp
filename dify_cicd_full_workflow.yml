app:
  description: 'Workflow CI/CD complet : Appel MCP pipelines_build + Génération de rapport Markdown par LLM'
  icon: 📊
  icon_background: '#E0F2FE'
  mode: workflow
  name: Analyse CI/CD Azure DevOps
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-to-tool
        source: start
        sourcePort: source
        target: tool_pipelines_build
        targetPort: target
      - id: tool-to-llm
        source: tool_pipelines_build
        sourcePort: source
        target: llm_report
        targetPort: target
      - id: llm-to-end
        source: llm_report
        sourcePort: source
        target: end
        targetPort: target
    nodes:
      - data:
          desc: 'Nom du projet Azure DevOps'
          selected: false
          title: Début
          type: start
          variables:
            - default: RDT-Simulator
              label: Nom du projet
              max_length: 100
              options: []
              required: true
              type: text-input
              variable: project_name
        height: 90
        id: start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 'Récupère les 5 derniers builds via MCP'
          is_team_authorization: false
          param_schemas: []
          params:
            action: list
            project: '{{#start.project_name#}}'
            top: 5
          provider_id: azure-devops
          provider_name: azure-devops
          provider_type: mcp
          selected: false
          title: pipelines_build
          tool_configurations: {}
          tool_name: pipelines_build
          type: tool
        height: 90
        id: tool_pipelines_build
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 'Rédige le rapport CI/CD à partir des données réelles'
          model:
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - role: system
              text: |
                Tu es un expert DevOps Senior spécialisé en Azure DevOps.
                À partir des données JSON de builds ci-dessous, rédige un rapport clair, professionnel et structuré en Markdown.

                Données brutes des builds récents :
                {{#tool_pipelines_build.text#}}

                Structure obligatoire du rapport :
                # 📊 Rapport CI/CD — {{#start.project_name#}}
                ### 1. Synthèse Globale
                - **Statut général :** (🟢 Stable / 🔴 En échec / ⚪ Aucun build récent)
                - **Nombre de builds analysés :**
                - **Dernier build :** ID, Branche, Auteur, Date, Résultat

                ### 2. Détail des Builds Récents
                Tableau récapitulatif (ID | Définition | Branche | Statut | Date)

                ### 3. Recommandations DevOps
                Conseils prioritaires basés sur l'état des pipelines.
          selected: false
          title: Rapport CI/CD
          type: llm
          vision:
            enabled: false
        height: 90
        id: llm_report
        position:
          x: 680
          y: 280
        positionAbsolute:
          x: 680
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 'Sortie finale'
          outputs:
            - value_selector:
                - llm_report
                - text
              variable: rapport_markdown
            - value_selector:
                - tool_pipelines_build
                - text
              variable: builds_json_brut
          selected: false
          title: Fin
          type: end
        height: 90
        id: end
        position:
          x: 980
          y: 280
        positionAbsolute:
          x: 980
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

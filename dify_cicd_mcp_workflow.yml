app:
  name: Rapport CI CD Azure DevOps MCP
  description: 'Configuration apres import: dans le noeud Agent CI/CD, selectionnez votre modele et cochez vos 3 outils MCP ado-mcp.'
  icon: 📊
  icon_background: '#DBEAFE'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: Début
        desc: ''
        selected: false
        variables:
        - variable: project_name
          label: Nom du projet Azure DevOps
          type: text-input
          required: true
          default: RDT-Simulator
          max_length: 128
          options: []

    - id: agent_devops
      type: custom
      position:
        x: 420
        y: 300
      positionAbsolute:
        x: 420
        y: 300
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: agent
        title: Agent CI/CD (MCP)
        desc: 'Selectionner vos outils MCP dans ce noeud apres import.'
        selected: false
        agent_strategy_provider_name: langgenius/agent/agent
        agent_strategy_name: function_calling
        agent_strategy_label: FunctionCalling
        plugin_unique_identifier: langgenius/agent:0.0.18@653bd665354a6e9412dad9c6031022a3cb38dd81fb0f90a408c03b023bd13141
        output_schema: {}
        agent_parameters:
          model:
            type: constant
            value:
              provider: langgenius/openai_api_compatible/openai_api_compatible
              model: CONFIGURER_VOTRE_MODELE
              model_type: llm
              mode: chat
              completion_params:
                temperature: 0.1
              type: model-selector
          instruction:
            type: constant
            value: |
              Tu es un ingénieur DevOps senior expert en intégration continue (CI/CD) Azure DevOps.
              Analyse la santé du projet {{#start.project_name#}} à l'aide des outils MCP disponibles :

              Démarche :
              1. Appelle `get_project_cicd_summary(project="{{#start.project_name#}}")` :
                 - Récupère le nombre de pipelines, le nombre total de builds récents et le statut du dernier build.
              2. Appelle `get_last_failed_build(project="{{#start.project_name#}}")` :
                 - Si la réponse est `{"status": "PIPELINE_OK"}` : confirme que le pipeline est sain ou n'a aucun échec récent.
                 - Si un build en échec est renvoyé :
                   a. Appelle `get_build_logs(project="{{#start.project_name#}}", build_id=..., tail=100)` pour obtenir les logs de l'erreur.
                   b. Analyse précisément la cause racine dans le log (erreur de compilation, dépendance manquante, script bash, test unitaire, nom de version SemVer, etc.).
                   c. Donne les actions de remédiation exactes.

              Structure obligatoire du rapport en Markdown :
              # 📊 Rapport CI/CD — [Nom du Projet]
              ### 1. Synthèse Globale
              - **Statut de santé :** (🟢 Stable / 🔴 En échec / ⚪ Non déclenché)
              - **Pipelines configurés :** [Nombre]
              - **Activité récente :** [Nombre de builds récents analysés]
              - **Dernier build :** ID, branche, auteur, date/heure

              ### 2. Analyse du dernier échec (si applicable)
              - **Build ID :** #[id]
              - **Branche :** [branche]
              - **Auteur :** [nom] ([email])
              - **Commit :** `[sha]`
              - **Lien Azure DevOps :** [Lien cliquable]

              ### 3. Diagnostic des Logs
              ```text
              [Extraits pertinents du log montrant l'erreur exacte]
              ```
              - **Cause racine identifiée :** [Explication claire]

              ### 4. Recommandations & Actions Correctives
              - [Action 1]
              - [Action 2]
          query:
            type: constant
            value: 'Analyse le statut CI/CD du projet {{#start.project_name#}}'
          maximum_iterations:
            type: constant
            value: 6
          tools:
            type: constant
            value: []

    - id: end_report
      type: custom
      position:
        x: 760
        y: 300
      positionAbsolute:
        x: 760
        y: 300
      width: 280
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: end
        title: Affichage du Rapport
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - agent_devops
          - text
          variable: rapport_cicd

    edges:
    - id: e1
      source: start
      sourceHandle: source
      target: agent_devops
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: agent
    - id: e2
      source: agent_devops
      sourceHandle: source
      target: end_report
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: agent
        targetType: end

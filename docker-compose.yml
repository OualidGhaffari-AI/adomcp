services:
  ado-mcp:
    image: node:20-alpine
    container_name: ado-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      PERSONAL_ACCESS_TOKEN: ${ADO_PAT_B64}
    command: >
      npx -y supergateway
      --stdio "npx -y @azure-devops/mcp netopiacs --authentication pat -d core work work-items repositories pipelines wiki"
      --outputTransport streamableHttp
      --port 8000
    ports:
      - "8000:8000"
    networks:
      - default
      - dify_network

networks:
  dify_network:
    external: true
    name: docker_default

app:
  description: 'Test direct et déterministe de l''outil MCP Azure DevOps sans LLM'
  icon: 🛠️
  icon_background: '#D1E9FF'
  mode: workflow
  name: Test Direct MCP Azure DevOps
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-to-tool
        source: start
        sourcePort: source
        target: tool_pipelines_build
        targetPort: target
      - id: tool-to-end
        source: tool_pipelines_build
        sourcePort: source
        target: end
        targetPort: target
    nodes:
      - data:
          desc: 'Point d''entrée avec le nom du projet Azure DevOps'
          selected: false
          title: Début
          type: start
          variables:
            - default: RDT-Simulator
              label: Nom du projet
              max_length: 100
              options: []
              required: true
              type: text-input
              variable: project_name
        height: 90
        id: start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 'Appel direct de l''outil MCP pipelines_build'
          is_team_authorization: false
          param_schemas: []
          params:
            action: list
            project: '{{#start.project_name#}}'
            top: 5
          provider_id: azure-devops
          provider_name: azure-devops
          provider_type: mcp
          selected: false
          title: pipelines_build
          tool_configurations: {}
          tool_name: pipelines_build
          type: tool
        height: 90
        id: tool_pipelines_build
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 'Affichage du JSON brut renvoyé par Azure DevOps'
          outputs:
            - value_selector:
                - tool_pipelines_build
                - text
              variable: builds_json
          selected: false
          title: Fin
          type: end
        height: 90
        id: end
        position:
          x: 680
          y: 280
        positionAbsolute:
          x: 680
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
